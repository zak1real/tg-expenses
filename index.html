<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Расходы</title>
  <!-- SDK Telegram Mini Apps: тема, кнопки, облачное хранилище -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" id="appLogo"></div>
        <div class="brand__text">
          <h1 id="appName"></h1>
          <p id="greeting"></p>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </header>

    <main class="view">
      <div class="month">
        <button class="icon-btn" type="button" data-month="-1" aria-label="Предыдущий месяц">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="icon-btn" type="button" data-month="1" aria-label="Следующий месяц">›</button>
      </div>

      <section class="panel" id="summary"></section>
      <section class="panel" id="chart"></section>

      <div class="section-head">
        <h3>Операции</h3>
        <div class="segmented segmented--small" id="typeFilter">
          <button type="button" data-filter="all">Все</button>
          <button type="button" data-filter="expense">Расходы</button>
          <button type="button" data-filter="income">Доходы</button>
        </div>
      </div>
      <div id="catFilter"></div>
      <div id="opsList"></div>
    </main>

    <!-- Кнопка внизу для обычного браузера. В Telegram вместо неё — нативная MainButton -->
    <div class="bottom-bar" id="bottomBar" hidden>
      <button class="main-btn" id="mainBtn" type="button"></button>
    </div>
  </div>

  <!-- Вступление для нового пользователя. Кнопка «Далее» — MainButton в Telegram или .bottom-bar в браузере -->
  <div class="intro" id="intro" hidden>
    <button type="button" class="intro__skip" id="introSkip">Пропустить</button>
    <div class="intro__body" id="introSlide"></div>
    <div class="intro__dots" id="introDots"></div>
  </div>

  <!-- Шторка: добавление операции и настройки -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel">
      <div class="sheet__handle" data-close></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
